name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version number only (e.g. 0.8.0) - creates tag v<version>"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release with the built artifacts"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  EXPLOT_NONINTERACTIVE: "1"
  EXPLOT_DMG: "1"

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}' - enter just the version number, e.g. 0.8.0"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: prep
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [apple, intel, intel_compat]
    env:
      EXPLOT_TARGET: ${{ matrix.target }}
      EXPLOT_MODE: all
      EXPLOT_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set app version
        run: sed -i '' 's/^VERSION = ".*"$/VERSION = "${{ needs.prep.outputs.version }}"/' explot.py

      - name: Install python.org universal2 Python 3.12.10
        run: |
          curl -fSL -o /tmp/python.pkg "https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          "$PY" --version
          lipo -archs "$PY"

      - name: Ensure Rosetta 2 for Intel targets
        if: matrix.target != 'apple'
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Build and package
        run: ./build.sh

      - name: Verify artifact
        run: |
          set -e
          ls -lh build_*/ExPlot_v*.dmg
          lipo -archs build_*/ExPlot.app/Contents/MacOS/ExPlot
          codesign -dv --verbose=2 build_*/ExPlot.app 2>&1 | grep "Signature="
          echo "App bundle is signed"
          codesign --verify --deep --strict build_*/ExPlot.app \
            || echo "::warning::deep-strict verification failed - expected with unsigned data files (tkdnd pkgIndex.tcl etc.), the ad-hoc app signature itself is valid"
          mkdir -p release_assets
          cp build_*/ExPlot_v*.dmg release_assets/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: release_assets/*.dmg

  windows:
    needs: prep
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version
        shell: bash
        run: sed -i 's/^VERSION = ".*"$/VERSION = "${{ needs.prep.outputs.version }}"/' explot.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ExPlot.spec

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ExPlot.exe -DestinationPath "ExPlot_v${{ needs.prep.outputs.version }}_Windows.zip" -Force
          Get-Item "ExPlot_v${{ needs.prep.outputs.version }}_Windows.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ExPlot_v*_Windows.zip

  release:
    if: inputs.create_release
    needs: [prep, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh artifacts/
          gh release create "v${{ needs.prep.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ExPlot v${{ needs.prep.outputs.version }}" \
            --generate-notes \
            artifacts/*.dmg artifacts/*.zip
